<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Stars</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2128; --border:#30363d;
    --fg:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --star:#e3b341;
    --hover:#1f2630; --pill:#21262d;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#ffffff; --panel:#f6f8fa; --panel2:#eef1f4; --border:#d0d7de;
      --fg:#1f2328; --muted:#656d76; --accent:#0969da; --star:#bf8700;
      --hover:#f3f5f7; --pill:#eaeef2;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--fg);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",Helvetica,Arial,sans-serif;
  }
  header{
    position:sticky; top:0; z-index:10;
    background:var(--panel); border-bottom:1px solid var(--border);
    padding:12px 16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center;
  }
  h1{font-size:16px; margin:0 12px 0 0; font-weight:600; white-space:nowrap}
  h1 .n{color:var(--muted); font-weight:400; font-size:13px}
  .controls{display:flex; flex-wrap:wrap; gap:8px; align-items:center; flex:1; min-width:260px}
  input[type=search], select, button{
    background:var(--panel2); color:var(--fg); border:1px solid var(--border);
    border-radius:6px; padding:6px 10px; font:inherit; outline:none;
  }
  input[type=search]{flex:1; min-width:200px}
  input[type=search]:focus, select:focus{border-color:var(--accent)}
  button{cursor:pointer}
  button:hover{background:var(--hover)}
  main{padding:0 16px 40px}
  table{border-collapse:collapse; width:100%; table-layout:fixed}
  /* 列宽：仓库收窄，描述/标签拿大头 */
  thead th:nth-child(1){width:16%}   /* 仓库 */
  thead th:nth-child(2){width:6%}    /* 语言 */
  thead th:nth-child(3){width:5%}    /* Star */
  thead th:nth-child(4){width:33%}   /* 描述 */
  thead th:nth-child(5){width:26%}   /* 标签 */
  thead th:nth-child(6){width:7%}    /* 收藏时间 */
  thead th:nth-child(7){width:7%}    /* 链接 */
  thead th{
    position:sticky; top:57px; z-index:5;
    background:var(--panel); border-bottom:1px solid var(--border);
    text-align:left; padding:8px 10px; white-space:nowrap;
    cursor:pointer; user-select:none; font-size:12px; color:var(--muted);
    text-transform:uppercase; letter-spacing:.04em;
  }
  thead th:hover{color:var(--fg)}
  thead th.num{text-align:right}
  thead th::after{content:""; opacity:.35; margin-left:4px}
  thead th.asc::after{content:"▲"; opacity:1; color:var(--accent)}
  thead th.desc::after{content:"▼"; opacity:1; color:var(--accent)}
  tbody tr{border-bottom:1px solid var(--border)}
  tbody tr:hover{background:var(--hover)}
  tbody tr.archived{opacity:.55}
  td{padding:8px 10px; vertical-align:top}
  td.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
  a{color:var(--accent); text-decoration:none}
  a:hover{text-decoration:underline}
  .repo{font-weight:600; overflow-wrap:anywhere}
  .desc{overflow-wrap:anywhere}
  .topics{margin-top:4px; display:flex; flex-wrap:wrap; gap:4px}
  .tag{background:var(--pill); color:var(--muted); border-radius:999px; padding:1px 7px; font-size:11px}
  .more{font-size:12px; margin-left:6px; white-space:nowrap}
  .lang{white-space:nowrap; color:var(--muted)}
  .st{color:var(--star); font-variant-numeric:tabular-nums}
  .date{white-space:nowrap; color:var(--muted); font-size:12px}
  .flag{font-size:11px; color:var(--muted); border:1px solid var(--border); border-radius:4px; padding:0 4px; margin-left:6px}
  #empty{padding:60px; text-align:center; color:var(--muted)}
  mark{background:var(--accent); color:var(--bg); border-radius:2px; padding:0 1px}
  @media (max-width:900px){
    .col-topics{display:none}
    thead th{top:0}
  }
  @media (max-width:680px){
    .col-created{display:none}
    thead th:nth-child(2), td:nth-child(2),
    thead th:nth-child(7), td:nth-child(7){display:none}
  }
</style>
</head>
<body>
<header>
  <h1>⭐ GitHub Stars <span class="n" id="count"></span></h1>
  <div class="controls">
    <input id="q" type="search" placeholder="搜索仓库 / 描述 / 标签…（按 / 聚焦，Esc 清空）" autocomplete="off">
    <select id="lang"><option value="">全部语言</option></select>
    <select id="year"><option value="">全部年份</option></select>
    <select id="state">
      <option value="all">全部</option>
      <option value="active">未归档</option>
      <option value="archived">已归档</option>
      <option value="fork">仅 Fork</option>
    </select>
    <button id="reset" title="清空所有筛选">重置</button>
    <button id="export" title="把当前筛选结果存成 CSV">导出筛选</button>
  </div>
</header>
<main>
  <table>
    <thead>
      <tr>
        <th data-k="full_name">仓库</th>
        <th data-k="language">语言</th>
        <th data-k="stars" class="num">Star</th>
        <th data-k="description" class="col-desc">描述</th>
        <th data-k="topics" class="col-topics">标签</th>
        <th data-k="starred_at" class="col-created">收藏时间</th>
        <th data-k="url">链接</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty" hidden>没有匹配的仓库 🤷</div>
</main>

<script id="stars-data" type="application/json">__STARS_DATA__</script>
<script>
(function(){
  "use strict";
  const DATA = JSON.parse(document.getElementById("stars-data").textContent);
  const MAX_DESC = __MAX_DESC__;   // 描述超过这个长度就折叠，点“展开”看全文

  const $ = id => document.getElementById(id);
  const q = $("q"), langSel = $("lang"), yearSel = $("year"), stateSel = $("state");
  const tbody = $("rows"), countEl = $("count"), emptyEl = $("empty");

  // 索引每个仓库的可搜索文本，避免每次输入都重新拼接
  DATA.forEach(r => {
    r._y = (r.starred_at || "").slice(0, 4);
    r._blob = (r.full_name + " " + (r.description||"") + " " + (r.topics||"") + " " + (r.language||"")).toLowerCase();
  });

  // 填充下拉选项
  const langs = [...new Set(DATA.map(r => r.language).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const years = [...new Set(DATA.map(r => r._y).filter(Boolean))].sort().reverse();
  langs.forEach(v => langSel.add(new Option(v, v)));
  years.forEach(v => yearSel.add(new Option(v + " 年", v)));

  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  // 把命中的关键词高亮（只处理纯文本字段）
  function hl(text, needle){
    const safe = esc(text);
    if(!needle) return safe;
    try{
      const re = new RegExp("(" + needle.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")", "ig");
      return safe.replace(re, "<mark>$1</mark>");
    }catch(_){ return safe; }
  }

  // 描述单元格：过长时默认折叠，可点击展开全文
  function descHtml(r, needle){
    const full = r.description || "";
    if(!MAX_DESC || full.length <= MAX_DESC) return hl(full, needle);
    const n = full.length.toLocaleString("en-US");
    const label = `展开 (${n} 字)`;
    return `<span class="dshort">${hl(full.slice(0, MAX_DESC), needle)}…</span>`
         + `<span class="dfull" hidden>${hl(full, needle)}</span>`
         + `<a href="#" class="more" data-label="${label}">${label}</a>`;
  }

  let sortKey = "starred_at", sortDir = -1;

  function current(){
    const needle = q.value.trim().toLowerCase();
    const lang = langSel.value, year = yearSel.value, state = stateSel.value;

    let out = DATA.filter(r => {
      if(lang && r.language !== lang) return false;
      if(year && r._y !== year) return false;
      if(state === "active" && r.archived) return false;
      if(state === "archived" && !r.archived) return false;
      if(state === "fork" && !r.fork) return false;
      if(needle && !r._blob.includes(needle)) return false;
      return true;
    });

    const k = sortKey;
    out.sort((a,b) => {
      let x = a[k], y = b[k];
      if(k === "stars") return (x - y) * sortDir;
      x = String(x||""); y = String(y||"");
      return x.localeCompare(y, "zh", {numeric:true}) * sortDir;
    });
    return {rows: out, needle: needle};
  }

  function render(){
    const {rows, needle} = current();
    countEl.textContent = rows.length === DATA.length
      ? `${DATA.length} 个仓库`
      : `${rows.length} / ${DATA.length} 个仓库`;

    if(!rows.length){
      tbody.innerHTML = "";
      emptyEl.hidden = false;
      return;
    }
    emptyEl.hidden = true;

    const buf = [];
    for(const r of rows){
      const allTags = (r.topics || "").split(/\s+/).filter(Boolean);
      const MAX_TAGS = 12;
      const tags = allTags.slice(0, MAX_TAGS)
        .map(t => `<span class="tag">${hl(t, needle)}</span>`).join("")
        + (allTags.length > MAX_TAGS
            ? `<span class="tag" title="${esc(allTags.slice(MAX_TAGS).join(" "))}">+${allTags.length - MAX_TAGS}</span>`
            : "");
      buf.push(
        `<tr class="${r.archived ? "archived" : ""}">`
        + `<td><a class="repo" href="${esc(r.url)}" target="_blank" rel="noopener">${hl(r.full_name, needle)}</a>`
        +   (r.archived ? `<span class="flag">已归档</span>` : "")
        +   (r.fork ? `<span class="flag">fork</span>` : "")
        +   (r.license ? `<span class="flag">${esc(r.license)}</span>` : "")
        + `</td>`
        + `<td class="lang">${esc(r.language || "—")}</td>`
        + `<td class="num st">${Number(r.stars).toLocaleString("en-US")}</td>`
        + `<td class="desc col-desc">${descHtml(r, needle)}</td>`
        + `<td class="col-topics"><div class="topics">${tags}</div></td>`
        + `<td class="date col-created">${esc((r.starred_at||"").slice(0,10))}</td>`
        + `<td><a href="${esc(r.homepage || r.url)}" target="_blank" rel="noopener">${r.homepage ? "官网" : "GitHub"}</a></td>`
        + `</tr>`
      );
    }
    tbody.innerHTML = buf.join("");
  }

  function applySort(key){
    if(key === sortKey){ sortDir = -sortDir; }
    else { sortKey = key; sortDir = (key === "stars" || key === "starred_at") ? -1 : 1; }
    document.querySelectorAll("thead th").forEach(th => {
      th.classList.toggle("asc", th.dataset.k === sortKey && sortDir === 1);
      th.classList.toggle("desc", th.dataset.k === sortKey && sortDir === -1);
    });
    render();
  }

  // 展开 / 收起长描述
  tbody.addEventListener("click", e => {
    const btn = e.target.closest(".more");
    if(!btn) return;
    e.preventDefault();
    const td = btn.closest("td");
    const short = td.querySelector(".dshort"), full = td.querySelector(".dfull");
    const opening = full.hidden;
    full.hidden = !opening;
    short.hidden = opening;
    btn.textContent = opening ? "收起" : btn.dataset.label;
  });

  // 事件绑定
  q.addEventListener("input", render);
  [langSel, yearSel, stateSel].forEach(el => el.addEventListener("change", render));
  document.querySelectorAll("thead th").forEach(th =>
    th.addEventListener("click", () => applySort(th.dataset.k))
  );
  $("reset").addEventListener("click", () => {
    q.value = ""; langSel.value = ""; yearSel.value = ""; stateSel.value = "";
    sortKey = "starred_at"; sortDir = -1;
    document.querySelectorAll("thead th").forEach(th => th.classList.remove("asc","desc"));
    render();
  });

  // 导出当前筛选结果（带 BOM，Excel 不乱码）
  $("export").addEventListener("click", () => {
    const {rows} = current();
    const cols = ["starred_at","full_name","language","stars","description","topics","url","homepage","archived","fork","license"];
    const escCsv = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const csv = [cols.join(",")]
      .concat(rows.map(r => cols.map(k => escCsv(r[k])).join(",")))
      .join("\r\n");
    const blob = new Blob(["\uFEFF" + csv], {type:"text/csv;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `stars-filtered-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  });

  // 快捷键：/ 聚焦搜索，Esc 清空
  document.addEventListener("keydown", e => {
    if(e.key === "/" && document.activeElement !== q){ e.preventDefault(); q.focus(); }
    else if(e.key === "Escape" && document.activeElement === q){ q.value = ""; render(); q.blur(); }
  });

  applySort("starred_at");
})();
</script>
</body>
</html>
